<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enlaces del curso · IA en CyT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
:root {
  --bg: #fbfafd; --surface: #fff; --ink: #1d1a24; --muted: #5d566c; --line: #ddd7e7;
  --b1: #c8325f; --b2: #7a48b5; --b3: #2a7f99; --b4: #33894a; --accent: #4b2275;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15131b; --surface: #1f1c27; --ink: #ece8f3; --muted: #a8a0b8; --line: #363044;
          --b1: #ea6a90; --b2: #a57ee0; --b3: #5db3cc; --b4: #6cc283; --accent: #b78be8; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 28px 16px 64px; }
h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 1.7rem; line-height: 1.15; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 24px; }
section { margin-top: 26px; }
h2 { display: flex; align-items: center; gap: 10px; font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
h2 i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.links { display: grid; gap: 10px; }
a.btn, span.btn {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  min-height: 56px; padding: 12px 16px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c);
  color: var(--ink); text-decoration: none; font-weight: 700;
}
a.btn:hover, a.btn:focus-visible { border-color: var(--c); outline: none; }
a.btn::after { content: "→"; color: var(--c); font-size: 1.2rem; }
.btn small { display: block; font-weight: 400; color: var(--muted); font-size: .88rem; }
span.btn { opacity: .55; border-left-color: var(--line); }
span.btn::after { content: "Próximamente"; font-weight: 400; font-size: .8rem; color: var(--muted); white-space: nowrap; }
footer { margin-top: 36px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>IA Generativa aplicada a la enseñanza de Ciencia y Tecnología</h1>
  <p class="sub">Todos los enlaces del día. Guarda esta página en favoritos: <b>Ctrl + D</b>.</p>
  <div id="secciones"></div>
  <footer>Facilitador: Oscar Llerena</footer>
</main>

<script>
// Para agregar un enlace: reemplaza null por la URL entre comillas.
const SECCIONES = [
  { titulo: "Al empezar", color: "--accent", links: [
    { texto: "Check-in 1", nota: "Marca tu asistencia al Bloque 1 (nombre y DNI) y responde 5 preguntas rápidas que no van a la nota. Abierto 15 min.", url: "https://docs.google.com/forms/d/e/1FAIpQLSc1ahkah_NiAmpojCLWLURpU1FnWWCsWva4G28c7WytFovVFg/viewform" },
    { texto: "Plantilla del producto", nota: "Clic en “Crear una copia” y renómbrala con tu código",
      url: "https://docs.google.com/presentation/d/1Dcy6BKEWJX_798R4EWJUCdBOkZOsuLwU_lLnaYuLE1c/copy" },
    { texto: "Producto modelo (ejemplo lleno)", nota: "La col morada, 3.° de secundaria: así queda cada sección. Solo lectura",
      url: "https://docs.google.com/presentation/d/1Jb6sT5jUWyKX5Zu0ERNHXmPIscyvMR7e5XfpFnFXlFk/edit?usp=sharing" },
    { texto: "Meet", nota: "Solo para el chat: micrófono y cámara apagados", url: null },
    { texto: "Guía del participante", nota: "Paso a paso de todo el día · Anexo A: los prompts 1 a 8 (PDF)", url: "https://drive.google.com/file/d/1edZaEUdth5rbdjGkkR3DAbWi0z1Fy096/view?usp=sharing" },
  ]},
  { titulo: "Bloque 1 · Prompts", color: "--b1", links: [
    { texto: "Temas por grado", nota: "Elige tu tema y copia sus 2 desempeños", url: "temas.html" },
    { texto: "Ficha de desempeños", nota: "Todos los desempeños de Indaga, por grado", url: "ficha.html" },
  ]},
  { titulo: "Bloque 2 · Gemini Notebook", color: "--b2", links: [
    { texto: "Check-in 2", nota: "Marca tu asistencia al Bloque 2 (DNI) y responde 1 pregunta sobre el Bloque 1. Abierto 15 min.", url: "https://docs.google.com/forms/d/e/1FAIpQLSfALzL6CWdS4R0BaSWdio7q7ceHJDNGsRmSqexpSxkbyby21g/viewform" },
  ]},
  { titulo: "Bloque 3 · Guía, fundamentos y verificación", color: "--b3", links: [
    { texto: "Check-in 3", nota: "Marca tu asistencia al Bloque 3 (DNI) y responde 1 pregunta sobre el Bloque 2. Abierto 15 min.", url: "https://docs.google.com/forms/d/e/1FAIpQLSf7-hG9AuksqZwNr71N8gmPnOlP7byaM8OqDetFjGZR4sjNaA/viewform" },
  ]},
  { titulo: "Bloque 4 · Diapositivas, recursos visuales y entrega", color: "--b4", links: [
    { texto: "Check-in 4", nota: "Marca tu asistencia al Bloque 4 (DNI) y responde 1 pregunta sobre el Bloque 3. Abierto 15 min.", url: "https://docs.google.com/forms/d/e/1FAIpQLSeiKWZbex2Q2WpfdP2cGkK_xp82OOOgOwfGCIP0pbQG6PmjNg/viewform" },
    { texto: "Gemini", nota: "Imágenes (pide “genera una imagen…”) y Canvas (página interactiva)", url: "https://gemini.google.com" },
    { texto: "Napkin AI", nota: "Diagramas a partir de tu texto · entra con tu Gmail · exporta PNG", url: "https://www.napkin.ai" },
    { texto: "Google Imágenes", nota: "Fotos con licencia: Herramientas → Derechos de uso → Creative Commons", url: "https://images.google.com" },
    { texto: "Form de salida", nota: "Código, 5 preguntas y encuesta", url: "https://docs.google.com/forms/d/e/1FAIpQLSePaSt1tpD63bErE7ILTdnV-gG7Qk8BL2SFtYsZqeUXI16OnA/viewform" },
    { texto: "Form de entrega", nota: "PDF y link · hasta las 23:59 · vale el último envío · pide iniciar sesión con Gmail", url: "https://docs.google.com/forms/d/e/1FAIpQLSeEwZuzQ-L_0aTLW-PUWoqWrgW2LsFETqq0RHYX3hikWP5wmA/viewform" },
  ]},
  { titulo: "Ayuda", color: "--muted", links: [
    { texto: "Preguntas frecuentes", url: null },
  ]},
];

const cont = document.getElementById("secciones");
for (const s of SECCIONES) {
  const sec = document.createElement("section");
  sec.style.setProperty("--c", `var(${s.color})`);
  const h = document.createElement("h2");
  h.innerHTML = `<i style="background:var(${s.color})"></i>`;
  h.append(s.titulo);
  const lista = document.createElement("div");
  lista.className = "links";
  for (const l of s.links) {
    const el = document.createElement(l.url ? "a" : "span");
    el.className = "btn";
    if (l.url) { el.href = l.url; if (/^https?:/.test(l.url)) { el.target = "_blank"; el.rel = "noopener"; } }
    const t = document.createElement("span");
    t.textContent = l.texto;
    if (l.nota) { const n = document.createElement("small"); n.textContent = l.nota; t.append(n); }
    el.append(t);
    lista.append(el);
  }
  sec.append(h, lista);
  cont.append(sec);
}
</script>
</body>
</html>
